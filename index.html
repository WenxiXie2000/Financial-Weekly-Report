<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>金融市场周报</title>
  <meta name="description" content="提供专业、清晰、可交互的金融市场周报数据展示。" />
  <link
    rel="stylesheet"
    href="https://cdn.staticfile.org/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    onerror="this.onerror=null;this.href='https://cdn.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css';"
  />
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('theme');
        if (saved) {
          document.documentElement.dataset.theme = saved;
        }
      } catch (err) {
        console.warn('[theme] 读取主题失败', err);
      }
    })();
  </script>
</head>
<body>
  <noscript class="noscript">
    您的浏览器未启用 JavaScript，页面功能将无法使用。请开启 JavaScript 后刷新页面。
  </noscript>

  <div class="app-shell">
    <div id="header-container"></div>
    <div class="layout">
      <aside id="sidebar-container" class="sidebar-host" aria-label="侧边导航容器"></aside>
      <main id="main-content" class="main-content" role="main" aria-live="polite">
        <div class="empty-state">正在加载模块…</div>
      </main>
    </div>
    <div id="footer-container"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
