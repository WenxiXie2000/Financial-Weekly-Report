<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel 转 JSON 工具 · 金融市场周报</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        onerror="this.onerror=null;this.href='https://cdn.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css'" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      padding: 24px;
    }
    .tool-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .tool-card {
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .step-list {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
    }
    .result-grid {
      display: grid;
      gap: 16px;
    }
    .result-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-item__header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }
    .result-item__meta {
      font-size: 14px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    textarea.preview {
      width: 100%;
      min-height: 160px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.18);
    }
    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border-color: var(--primary);
    }
    .alert {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: #b91c1c;
    }
  </style>
  <script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"
          onerror="this.onerror=null;this.src='https://cdn.baomitu.com/xlsx/0.18.5/xlsx.full.min.js'"></script>
  <script defer src="../js/data-adapter.js"></script>
</head>
<body>
  <main class="tool-container">
    <header>
      <h1 class="page-title">Excel 转 JSON 工具</h1>
      <p class="muted">使用 SheetJS 在浏览器本地解析《周报数据库valuesOnly.xlsx》，并按模块导出网站所需的 JSON 文件。</p>
    </header>

    <section class="tool-card">
      <h2>使用步骤</h2>
      <ol class="step-list">
        <li>点击下方输入框，选择 <strong>周报数据库valuesOnly.xlsx</strong> 文件。</li>
        <li>工具会自动读取每个工作表，并按照预设映射命名输出文件。</li>
        <li>检查每个模块的 JSON 预览，确认结构后点击“下载 JSON”。</li>
        <li>将下载的文件放入 <code>./data/values-only/</code> 目录，覆盖旧数据即可。</li>
      </ol>
      <div style="margin-top: 16px;">
        <label for="xlsx-input" class="btn">
          <i class="bi bi-upload"></i>
          选择 Excel 文件
        </label>
        <input id="xlsx-input" type="file" accept=".xlsx,.xls" style="display:none;" />
      </div>
    </section>

    <section id="result-area" class="result-grid" aria-live="polite"></section>
  </main>

  <script type="module">
    import { SHEET_PROFILES } from '../js/sheet-profiles.js';
    import { prevCompletedWeekRange, mondayOf, fridayOf } from '../js/utils.js';

    function getAnchorFromUrl() {
      try {
        const url = new URL(window.location.href);
        const raw = url.searchParams.get('anchor');
        if (!raw) return null;
        const candidate = new Date(`${raw}T00:00:00`);
        return Number.isNaN(candidate.getTime()) ? null : candidate;
      } catch (error) {
        console.warn('[tool][anchor] URL 解析失败', error);
        return null;
      }
    }

    const ANCHOR = (() => {
      const preset = window.__conversionAnchor;
      if (preset instanceof Date && !Number.isNaN(preset.getTime())) {
        const clone = new Date(preset.getTime());
        clone.setHours(0, 0, 0, 0);
        return clone;
      }
      const picked = getAnchorFromUrl() || new Date();
      picked.setHours(0, 0, 0, 0);
      window.__conversionAnchor = picked;
      return picked;
    })();

    const PROFILES = SHEET_PROFILES || {};

    const saveJson = (fileName, data) => {
      try {
        const payload = JSON.stringify(data ?? {}, null, 2);
        const blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      } catch (error) {
        console.error('[saveJson] 下载 JSON 失败', error);
      }
    };

    const pad2 = (value) => String(value).padStart(2, '0');

    const excelSerialToDate = (serial) => {
      if (typeof serial !== 'number' || Number.isNaN(serial)) return null;
      if (typeof XLSX !== 'undefined' && XLSX.SSF && XLSX.SSF.parse_date_code) {
        const parsed = XLSX.SSF.parse_date_code(serial);
        if (parsed) {
          const date = new Date(parsed.y, (parsed.m || 1) - 1, parsed.d || 1, parsed.H || 0, parsed.M || 0, parsed.S || 0, parsed.u || 0);
          date.setHours(0, 0, 0, 0);
          return date;
        }
      }
      const base = new Date(Date.UTC(1899, 11, 30));
      const millis = serial * 86400000;
      const date = new Date(base.getTime() + millis);
      if (Number.isNaN(date.getTime())) return null;
      date.setHours(0, 0, 0, 0);
      return date;
    };

        function deriveRange(series = []) {
          let minDate = null;
          let maxDate = null;
          series.forEach((item) => {
            if (!item || !Array.isArray(item.data)) return;
            item.data.forEach((entry) => {
              if (!Array.isArray(entry) || entry.length === 0) return;
              const raw = entry[0];
              const parsed = toDate(raw) || new Date(raw);
              if (!parsed || Number.isNaN(parsed.getTime())) return;
              if (!minDate || parsed < minDate) {
                minDate = new Date(parsed.getTime());
              }
              if (!maxDate || parsed > maxDate) {
                maxDate = new Date(parsed.getTime());
              }
            });
          });
          if (!minDate || !maxDate) {
            return null;
          }
          return [toISODateSafe(minDate), toISODateSafe(maxDate)];
        }
    const toDate = (value) => {
      if (value instanceof Date) {
        const cloned = new Date(value.getTime());
        cloned.setHours(0, 0, 0, 0);
        return cloned;
      }
      if (typeof value === 'number') {
        return excelSerialToDate(value);
      }
      if (typeof value === 'string') {
        const trimmed = value.trim();
        if (!trimmed) return null;
        const normalized = trimmed.includes('/') ? trimmed : trimmed.replace(/-/g, '/');
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) return null;
        date.setHours(0, 0, 0, 0);
        return date;
      }
      return null;
    };

    const formatDate = (date) => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    const fmtISO = (date) => {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '';
      return formatDate(date);
    };

    function toISODateSafe(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const year = value.getFullYear();
        const month = pad2(value.getMonth() + 1);
        const day = pad2(value.getDate());
        const hour = pad2(value.getHours());
        const minute = pad2(value.getMinutes());
        return value.getHours() || value.getMinutes()
          ? `${year}-${month}-${day} ${hour}:${minute}`
          : `${year}-${month}-${day}`;
      }

      const text = String(value ?? '').trim();
      if (!text) return '';
      const normalized = text.replace(/\//g, '-');
      const parsed = new Date(normalized);
      if (!Number.isNaN(parsed.getTime())) {
        const year = parsed.getFullYear();
        const month = pad2(parsed.getMonth() + 1);
        const day = pad2(parsed.getDate());
        const hour = pad2(parsed.getHours());
        const minute = pad2(parsed.getMinutes());
        return /:/.test(text)
          ? `${year}-${month}-${day} ${hour}:${minute}`
          : `${year}-${month}-${day}`;
      }
      return text;
    }

    const normalizeDateValue = (value) => {
      const date = toDate(value);
      if (date) {
        return { date, display: formatDate(date) };
      }
      const display = value == null ? '' : String(value).trim();
      return { date: null, display };
    };

    const toDateSafe = (value) => {
      const date = toDate(value);
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
        return null;
      }
      date.setHours(0, 0, 0, 0);
      return date;
    };

    const describeMatcher = (matcher) => {
      if (matcher instanceof RegExp) return matcher.toString();
      if (Array.isArray(matcher)) {
        return matcher.map((item) => describeMatcher(item)).join(' / ');
      }
      return String(matcher ?? '');
    };

    const normalizeHeaderLabel = (input) => {
      const text = String(input ?? '').trim();
      const noSpace = text.replace(/\s+/g, '');
      return noSpace.replace(/[（(][^）)]*[）)]\s*$/, '');
    };

    const closestHeaders = (header, pattern, topK = 3) => {
      const target = normalizeHeaderLabel(
        pattern instanceof RegExp
          ? String(pattern).replace(/^\/|\/[a-z]*$/gi, '')
          : pattern
      );
      if (!target) return [];

      const score = (source) => {
        const normalized = normalizeHeaderLabel(source);
        const m = normalized.length;
        const n = target.length;
        if (!m || !n) return 0;
        const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
        for (let i = 1; i <= m; i += 1) {
          for (let j = 1; j <= n; j += 1) {
            if (normalized[i - 1] === target[j - 1]) {
              dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
              dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
            }
          }
        }
        return dp[m][n] / Math.max(m, n);
      };

      return (header || [])
        .map((col) => [String(col ?? ''), score(col)])
        .sort((a, b) => b[1] - a[1])
        .slice(0, topK)
        .map(([col]) => col)
        .filter(Boolean);
    };

    const parsePercentNumber = (value) => {
      if (value == null || value === '') return null;
      if (typeof value === 'number') return value;
      const text = String(value).trim();
      if (!text) return null;
      const normalized = text.endsWith('%') ? text.slice(0, -1) : text;
      const num = Number(normalized.replace(/,/g, ''));
      return Number.isNaN(num) ? null : num;
    };

    const parseNumberLike = (value) => {
      if (value == null || value === '') return null;
      if (typeof value === 'number') return value;
      const num = Number(String(value).trim().replace(/,/g, ''));
      return Number.isNaN(num) ? null : num;
    };

    const isMissingRaw = (value) => {
      if (value === null || value === undefined) return true;
      if (typeof value === 'number') return Number.isNaN(value);
      const s = String(value).trim();
      if (!s) return true;
      const S = s.replace(/\u200B/g, '');
      const set = new Set([
        '-',
        '--',
        '---',
        '—',
        '——',
        '— —',
        '–',
        '—–',
        'N/A',
        'NA',
        'NaN',
        'NULL',
        'null',
        '无',
      ]);
      if (set.has(S)) return true;
      const t = S.endsWith('%') ? S.slice(0, -1).trim() : S;
      if (!t) return true;
      if (set.has(t)) return true;
      return false;
    };

    const missingToNull = (value) => (isMissingRaw(value) ? null : value);

    const toNumberOrNull = (value) => {
      const normalized = missingToNull(value);
      if (normalized === null) return null;
      let text = String(normalized).trim();
      if (text.endsWith('%')) {
        text = text.slice(0, -1).trim();
      }
      const num = Number(text);
      return Number.isNaN(num) ? null : num;
    };

    const toPctString4OrNull = (value) => {
      const normalized = missingToNull(value);
      if (normalized === null) return null;
      let text = String(normalized).trim();
      if (text.endsWith('%')) {
        text = text.slice(0, -1).trim();
      }
      const num = Number(text);
      if (Number.isNaN(num)) return null;
      return `${num.toFixed(4)}%`;
    };

    const computePrevWeekWorkdays = (rows, dateIdx, now = ANCHOR) => {
      if (!Array.isArray(rows) || typeof dateIdx !== 'number' || dateIdx < 0) return [];

      const enriched = rows
        .map((row) => ({ row, date: toDateSafe(row?.[dateIdx]) }))
        .filter((item) => item.row && item.date instanceof Date && !Number.isNaN(item.date.getTime()));

      if (!enriched.length) return [];

      const baseNow =
        now instanceof Date && !Number.isNaN(now.getTime())
          ? new Date(now.getTime())
          : new Date(now || ANCHOR);
      baseNow.setHours(0, 0, 0, 0);

      const { mon, fri } = prevCompletedWeekRange(baseNow);

      const clamp = (items, start, end) =>
        items.filter(({ date }) => date >= start && date <= end && isWeekday(date));

      const withinCompleted = clamp(enriched, mon, fri);
      if (withinCompleted.length) {
        return withinCompleted;
      }

      const latest = enriched.reduce((prev, cur) => (cur.date > prev.date ? cur : prev));
      if (!latest || !latest.date) return [];
      const fallbackMon = mondayOf(latest.date);
      const fallbackFri = fridayOf(latest.date);
      if (!fallbackMon || !fallbackFri) return [];
      return clamp(enriched, fallbackMon, fallbackFri);
    };

    const pickLatestWeekRow = (rows, dateIdx) => {
      if (!Array.isArray(rows) || typeof dateIdx !== 'number' || dateIdx < 0) return null;

      const enriched = rows
        .map((row) => ({ row, date: toDateSafe(row?.[dateIdx]) }))
        .filter((item) => item.row && item.date instanceof Date && !Number.isNaN(item.date.getTime()));
      if (!enriched.length) return null;

  const weekRows = computePrevWeekWorkdays(rows, dateIdx, ANCHOR);
      const pool = weekRows.length ? weekRows : enriched;
      const latest = pool.reduce((prev, cur) => (cur.date > prev.date ? cur : prev));
      if (!latest || !latest.row) return null;

      return {
        row: latest.row,
        date: latest.date,
      };
    };

    const deriveRange = (series = []) => {
      let minDate = null;
      let maxDate = null;
      series.forEach((item) => {
        if (!item || !Array.isArray(item.data)) return;
        item.data.forEach((entry) => {
          if (!Array.isArray(entry) || entry.length < 2) return;
          const parsed = toDateSafe(entry[0]) || toDateSafe(entry[0]?.[0]);
          if (!parsed) return;
          if (!minDate || parsed < minDate) minDate = new Date(parsed.getTime());
          if (!maxDate || parsed > maxDate) maxDate = new Date(parsed.getTime());
        });
      });
      if (!minDate || !maxDate) return [];
      return [formatDate(minDate), formatDate(maxDate)];
    };

    const buildByProfile = (rows, profile = {}, sheetName = '') => {
      if (!Array.isArray(rows) || rows.length === 0) {
        return {
          meta: {
            timezone: 'Asia/Shanghai',
            sourceSheet: sheetName,
            generatedAt: new Date().toISOString(),
            note: '空数据表',
          },
          summary: {},
          series: [],
        };
      }

      const headerRowIndex = Number.isInteger(profile.headerRow)
        ? Math.max(0, profile.headerRow)
        : 0;
      const header = pickHeaderRow(rows, headerRowIndex);

      const matchHeaderIndex = (matcher) => {
        if (!matcher) return -1;
        const regex = matcher instanceof RegExp ? matcher : new RegExp(String(matcher));
        return header.findIndex((cell) => regex.test(String(cell || '').trim()));
      };

      if (Array.isArray(profile.bondGroups) && profile.bondGroups.length) {
        const body = rows.slice(headerRowIndex + 1);

        let range = null;
        if (profile.range === 'prevWeekWorkdays') {
          range = getPrevWeekWorkdayRange();
        }

        const inRange = (value) => {
          if (!range) return true;
          if (!value) return false;
          const parsed = new Date(String(value).replace(/-/g, '/'));
          return !Number.isNaN(parsed.getTime()) && parsed >= range.start && parsed <= range.end;
        };

        const expandMatcher = (regexTpl, rank) => {
          if (regexTpl instanceof RegExp) {
            return new RegExp(regexTpl.source.replace('{R}', String(rank)), regexTpl.flags);
          }
          const pattern = String(regexTpl || '').replace('{R}', String(rank));
          return new RegExp(pattern);
        };

        const dateIdx = findColIndex(header, profile.dateCol);
        if (dateIdx < 0) {
          throw new Error('未找到日期列');
        }

        const seriesMap = new Map();
        const sumSizeMap = new Map();
        const latestBoard = {};

        for (const row of body) {
          const tRaw = row[dateIdx];
          if (!tRaw) continue;
          const isoDate = toISODateSafe(tRaw);
          if (!isoDate || !inRange(isoDate)) continue;

          if (typeof profile.rowFilter === 'function' && !profile.rowFilter({ date: isoDate })) {
            continue;
          }

          for (const group of profile.bondGroups) {
            if (!group || !Array.isArray(group.rankRange) || group.rankRange.length < 2) continue;
            const [rankStart, rankEnd] = group.rankRange;
            const ranks = [];

            for (let rank = rankStart; rank <= rankEnd; rank += 1) {
              const issuerMatcher = group?.cols?.issuer;
              const sizeMatcher = group?.cols?.size;
              const termMatcher = group?.cols?.term;
              const couponMatcher = group?.cols?.coupon;

              const issuerIdx = issuerMatcher
                ? findColIndex(header, expandMatcher(issuerMatcher, rank))
                : -1;
              const sizeIdx = sizeMatcher
                ? findColIndex(header, expandMatcher(sizeMatcher, rank))
                : -1;
              const termIdx = termMatcher
                ? findColIndex(header, expandMatcher(termMatcher, rank))
                : -1;
              const couponIdx = couponMatcher
                ? findColIndex(header, expandMatcher(couponMatcher, rank))
                : -1;

              if (issuerIdx < 0 && sizeIdx < 0 && termIdx < 0 && couponIdx < 0) {
                continue;
              }

              const issuerRaw = issuerIdx >= 0 ? row[issuerIdx] : null;
              const sizeRaw = sizeIdx >= 0 ? row[sizeIdx] : null;
              const termRaw = termIdx >= 0 ? row[termIdx] : null;
              const couponRaw = couponIdx >= 0 ? row[couponIdx] : null;

              const issuerClean = missingToNull(issuerRaw);
              const sizeNum = toNumberOrNull(sizeRaw);
              const termClean = missingToNull(termRaw);
              const couponNum = toNumberOrNull(couponRaw);

              if (
                issuerClean == null &&
                sizeNum == null &&
                termClean == null &&
                couponNum == null
              ) {
                continue;
              }

              ranks.push({
                rank,
                issuer:
                  issuerClean == null
                    ? null
                    : String(issuerClean).trim() || null,
                size: Number.isFinite(sizeNum) ? sizeNum : null,
                term:
                  termClean == null
                    ? null
                    : String(termClean).trim() || null,
                coupon: Number.isFinite(couponNum) ? couponNum : null,
                couponRaw,
              });
            }

            if (!ranks.length) continue;

            const sumSize = ranks.reduce(
              (acc, item) => acc + (Number.isFinite(item.size) ? item.size : 0),
              0
            );
            if (!sumSizeMap.has(group.key)) {
              sumSizeMap.set(group.key, []);
            }
            sumSizeMap.get(group.key).push([isoDate, String(sumSize)]);

            const coupons = ranks
              .map((item) => item.coupon)
              .filter((val) => Number.isFinite(val));
            if (coupons.length) {
              const avg = coupons.reduce((acc, val) => acc + val, 0) / coupons.length;
              if (!seriesMap.has(group.key)) {
                seriesMap.set(group.key, { label: group.label, data: [] });
              }
              seriesMap.get(group.key).data.push([isoDate, avg.toFixed(4)]);
            }

            const latest = latestBoard[group.key];
            const currentDate = new Date(isoDate.replace(/-/g, '/'));
            if (!Number.isNaN(currentDate.getTime())) {
              if (!latest || new Date(latest.__date.replace(/-/g, '/')) < currentDate) {
                latestBoard[group.key] = {
                  __date: isoDate,
                  rows: ranks.map((item) => {
                    const couponSource = item.couponRaw ?? item.coupon;
                    return {
                      rank: item.rank,
                      issuer: missingToNull(item.issuer) ?? null,
                      size_yi: toNumberOrNull(item.size),
                      term: missingToNull(item.term) ?? null,
                      coupon_pct: toPctString4OrNull(couponSource),
                    };
                  }),
                };
              }
            }
          }
        }

        const seriesEntries = Array.from(seriesMap.entries()).map(([key, payload]) => {
          const sorted = payload.data.sort((a, b) => new Date(a[0]) - new Date(b[0]));
          return {
            key,
            label: payload.label,
            data: sorted,
          };
        });

        const series = seriesEntries.map((entry) => ({
          name: `${entry.label} 票面利率(均值)`,
          data: entry.data,
        }));

        const summary = {};
        sumSizeMap.forEach((arr, key) => {
          if (!Array.isArray(arr) || !arr.length) return;
          arr.sort((a, b) => new Date(a[0]) - new Date(b[0]));
          const last = arr[arr.length - 1][1];
          summary[`${key}_sum_size`] = last;
        });

        series.forEach((serie) => {
          if (!Array.isArray(serie.data) || !serie.data.length) return;
          const baseName = serie.name.replace(/\s*票面利率\(均值\)\s*$/, '').trim();
          if (!baseName) return;
          const summaryKeyBase = baseName.replace(/[^A-Za-z0-9\u4e00-\u9fa5]+/g, '');
          const lastVal = serie.data[serie.data.length - 1][1];
          if (lastVal == null || lastVal === '') return;
          const num = Number(lastVal);
          summary[`${summaryKeyBase}_avg_coupon`] = Number.isFinite(num)
            ? `${num.toFixed(4)}%`
            : String(lastVal);
        });

        const board = {};
        Object.entries(latestBoard).forEach(([key, value]) => {
          if (!value || !value.rows) return;
          board[key] = {
            date: value.__date,
            rows: [...value.rows].sort((a, b) => a.rank - b.rank),
          };
        });

        const exportInfo = {
          rows: body.length,

        const rangePair = deriveRange(series);

        const meta = {

      }

      if (Array.isArray(profile.seriesByDateKey) && profile.seriesByDateKey.length) {
        const dateIdxMap = Object.entries(profile.dateCols || {}).reduce((acc, [key, matcher]) => {

        const seriesDefs = profile.seriesByDateKey

        if (!seriesDefs.length) {

        const formatSummaryKey = (label) => {
          const slug = label.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
          return (slug || label.replace(/\s+/g, '').toLowerCase()) + '_rate';
        };

        const bodyRows = rows.slice(headerRowIndex + 1);
        const enriched = bodyRows
          .map((row) => {
            if (!Array.isArray(row)) return null;
            const entries = seriesDefs.map((def) => {
              const info = normalizeDateValue(row[def.dateIdx]);

            });
            const fallback = entries.find((entry) => entry.info.display) || null;
            if (!fallback) return null;

          })
          .filter(Boolean);

        const allDates = enriched
          .map((entry) => entry.fallback.date || toDate(entry.fallback.info.display))
          .filter((d) => d instanceof Date && !Number.isNaN(d.getTime()));

        const rangeStrategy = profile.range || profile.rangeDefault;
        let range = null;
        if (rangeStrategy === 'prevWeekWorkdays' || rangeStrategy === 'prevWeekOnly') {
          if (allDates.length) {

            const anchor = new Date(latest.getTime());
            const day = anchor.getDay() || 7;
            anchor.setHours(0, 0, 0, 0);
            const monday = new Date(anchor.getTime());
            monday.setDate(anchor.getDate() - (day - 1));
            const friday = new Date(monday.getTime());
            friday.setDate(monday.getDate() + 4);

        } else if (typeof rangeStrategy === 'string' && rangeStrategy.startsWith('lastNDays:')) {

        } else if (rangeStrategy && typeof rangeStrategy === 'object') {

          const end = rangeStrategy.end ? toDate(rangeStrategy.end) : null;
          if (start || end) {

        const inRange = (value) => {

          if (!date || Number.isNaN(date.getTime())) return false;
          if (range.start && date < range.start) return false;

        const buckets = new Map();

        const toSortedPairs = (pairs) =>

        enriched.forEach((entry) => {

          const fallbackInRange = inRange(fallbackDate || fallbackInfo.display);

            latestByLabel.set(def.label, {

        const defByLabel = new Map(seriesDefs.map((item) => [item.label, item]));

        const summary = {};
        series.forEach((serie) => {

        const overallRange = deriveRange(series);

        const meta = {

        if (range) {

          meta.rangeEnd = range.end ? formatDate(range.end) : '';
          if (meta.rangeStart && meta.rangeEnd) {

      }

      const dateIdx = findColIndex(header, profile.dateCol);
      const allowNullPoints = profile.allowNullPoints !== false;
      const seriesConfigs = Array.isArray(profile.series) ? profile.series : [];
      const seriesCols = seriesConfigs
        .map((conf) => {
          const label = conf?.label || conf?.name || conf?.key;

          const closeIdx = conf.close ? findColIndex(header, conf.close) : -1;

      const kpiCols = (profile.kpis || [])

      const candidateDates = (() => {

  if (typeof strategy === 'string' && strategy.startsWith('lastNDays:')) {

          start.setDate(start.getDate() - Math.max(0, n - 1));

      const range = resolveRange(rangeStrategy);

      const inRange = (value) => {

        if (!date || Number.isNaN(date.getTime())) return false;

      const seriesMap = new Map();

        let fallbackInfo = resolveDateInfo(dateIdx);

        meta.rangeEnd = range.end ? formatDate(range.end) : '';
        if (meta.rangeStart && meta.rangeEnd) {

    const SHEET_TO_FILE = {
      '国内股市': 'equity_cn.json',
      '全球股市': 'equity_global.json',
      '人民币汇率': 'cny_fx.json',
      '公开市场': 'open_market.json',
      '公开市场货币': 'open_market.json',
      'Shibor利率': 'open_market.json',
      '债券利率': 'bond_yield.json',
      '集团上市公司': 'group_listed.json',
      '国能上市公司': 'group_listed.json',
      '财经资讯': 'news.json',
    };

    const SHEET_MAPPING = {
      ...SHEET_TO_FILE,
      ...((window.dataAdapter && window.dataAdapter.SHEET_TO_FILE) || {}),
    };

    const KEYWORDS = {
      date: ['日期', 'date', '时间', 'time'],
      value: ['数值', 'value', '值', 'price', 'close'],
      series: ['系列', 'series', '名称', 'name'],
    };

    // === Header 行索引：允许表头不在第一行 ===
    function pickHeaderRow(rows, headerRowIndex = 0) {
      const idx = Math.max(0, Number(headerRowIndex) || 0);
      return (rows[idx] || []).map((x) => String(x || '').trim());
    }

    // === 计算“上一周工作日”区间（周一~周五，以本地时区/Asia/Shanghai）===
    function getPrevWeekWorkdayRange(now = ANCHOR) {
      const baseNow =
        now instanceof Date && !Number.isNaN(now.getTime())
          ? new Date(now.getTime())
          : new Date(now || ANCHOR);
      baseNow.setHours(0, 0, 0, 0);
      const { mon, fri } = prevCompletedWeekRange(baseNow);
      return { start: mon, end: fri };
    }

    // === 工作日判定（周一到周五）===
    function isWeekday(dateObj) {
      const d = dateObj.getDay();
      return d >= 1 && d <= 5;
    }

    function computeRangeRows(rows, dateIdx, mode) {
      if (!Array.isArray(rows) || typeof dateIdx !== 'number' || dateIdx < 0) return [];

      const enriched = rows
        .map((row) => ({ row, date: toDateSafe(row?.[dateIdx]) }))
        .filter((item) => item.row && item.date instanceof Date && !Number.isNaN(item.date.getTime()));
      if (!enriched.length) return [];

      const sorted = enriched.slice().sort((a, b) => a.date - b.date);

      if (typeof mode === 'string' && mode.startsWith('lastNDays:')) {
        const n = Number(mode.split(':')[1] || '90');
        const latest = sorted[sorted.length - 1].date;
        const begin = new Date(latest.getTime() - n * 86400000);
        return sorted.filter(
          (item) => item.date >= begin && item.date <= latest && isWeekday(item.date)
        );
      }

      return sorted;
    }

    // === 百分比格式化为“xx.xxxx%” (四位小数)；兼容 "0.1234" 或 "12.34%" 或 "12.34" ===
    function formatPercent4(val) {
      if (val == null || val === '') return null;
      const s = String(val).trim();
      const num = s.endsWith('%') ? parseFloat(s.slice(0, -1)) : parseFloat(s);
      if (Number.isNaN(num)) return null;
      const normalized = Math.abs(num) <= 1 && !s.endsWith('%') ? num * 100 : num;
      return `${normalized.toFixed(4)}%`;
    }

    function formatNumber4(val) {
      if (val == null || val === '') return null;
      if (typeof val === 'number') {
        if (Number.isNaN(val)) return null;
        return val.toFixed(4);
      }
      const normalized = Number(String(val).trim().replace(/,/g, ''));
      if (Number.isNaN(normalized)) return null;
      return normalized.toFixed(4);
    }

    function findColIndex(header, matcher) {
      if (!Array.isArray(header)) return -1;
      const original = header.map((cell) => String(cell ?? ''));
      const normalized = original.map((cell) => normalizeHeaderLabel(cell));

      if (typeof matcher === 'string') {
        const idx = original.findIndex((cell) => cell === matcher);
        if (idx >= 0) return idx;
        const want = normalizeHeaderLabel(matcher);
        return normalized.findIndex((cell) => cell === want);
      }

      if (matcher instanceof RegExp) {
        const idx = original.findIndex((cell) => matcher.test(cell));
        if (idx >= 0) return idx;
        return normalized.findIndex((cell) => matcher.test(cell));
      }

      return -1;
    }

    const findColumnIndex = (headers, keywords) => {
      const lowerHeaders = headers.map((h) => String(h || '').trim().toLowerCase());
      for (const keyword of keywords) {
        const idx = lowerHeaders.indexOf(keyword.toLowerCase());
        if (idx >= 0) return idx;
      }
      return -1;
    };

    const extractSummaryRows = (rows) => {
      const summary = {};
      for (const row of rows) {
        if (!row || row.length === 0) continue;
        const [key, value] = row;
        if (!key || value === undefined || value === null) continue;
        summary[String(key).trim()] = typeof value === 'number' ? value : String(value).trim();
      }
      return summary;
    };

    const parseSeriesRows = (rows, headerRow) => {
      const headers = headerRow.map((cell) => String(cell || '').trim());
      const dateIdx = findColumnIndex(headers, KEYWORDS.date);
      const valueIdx = findColumnIndex(headers, KEYWORDS.value);
      const seriesIdx = findColumnIndex(headers, KEYWORDS.series);

      if (dateIdx === -1 || valueIdx === -1) {
        return { series: [], note: '未识别到“日期/数值”列，请检查表头。' };
      }

      const seriesMap = new Map();
      rows.forEach((row) => {
        if (!row) return;
        const date = row[dateIdx];
        const value = row[valueIdx];
        if (date === undefined || value === undefined) return;
        const seriesName = seriesIdx >= 0 ? row[seriesIdx] || '默认系列' : '默认系列';
        if (!seriesMap.has(seriesName)) {
          seriesMap.set(seriesName, []);
        }
        seriesMap.get(seriesName).push([String(date).trim(), String(value).trim()]);

    const convertShibor = (rows, profile = {}) => {
      const headerRowIndex = Number.isInteger(profile?.headerRow)
        ? Math.max(0, profile.headerRow)
        : 0;
      const header = rows[headerRowIndex] || [];
      const body = rows
        .slice(headerRowIndex + 1)
        .filter(
          (row) =>
            Array.isArray(row) &&
            row.some((cell) => cell !== undefined && cell !== null && String(cell).trim() !== '')
        );

      const groups = Array.isArray(profile?.groups) ? profile.groups : [];
      const diagGroups = [];
      const series = [];

      const normalizeRate = (value) => {
        const parsed = parsePercentNumber(value);
        if (parsed == null || Number.isNaN(parsed)) return null;
        return Number(Number(parsed).toFixed(4));
      };

      groups.forEach((group) => {
        const dateMatcher = group?.dateCol;
        const dateIdx = findColIndex(header, dateMatcher);
        const dateDiag = {
          matcher: describeMatcher(dateMatcher),
          hit: dateIdx >= 0,
          column: dateIdx >= 0 ? header[dateIdx] || null : null,
          candidates: dateIdx >= 0 ? [] : closestHeaders(header, dateMatcher),
          points: 0,
          dateRange: [],
        };

        const itemDefs = (Array.isArray(group?.items) ? group.items : []).map((item) => {
          const colIdx = findColIndex(header, item?.col);
          const diag = {
            key: item?.key || '',
            label: item?.label || item?.key || '',
            matcher: describeMatcher(item?.col),
            hit: colIdx >= 0,
            column: colIdx >= 0 ? header[colIdx] || null : null,
            candidates: colIdx >= 0 ? [] : closestHeaders(header, item?.col),
            points: 0,
            dateRange: [],
          };
          return { item, colIdx, diag };
        });

        const diagGroup = {
          range: group?.range || null,
          date: dateDiag,
          items: itemDefs.map(({ diag }) => diag),
        };
        diagGroups.push(diagGroup);

        if (dateIdx < 0) {
          return;
        }

        const datedRows = body
          .map((row) => {
            const date = toDateSafe(row?.[dateIdx]);
            if (!date) return null;
            return { row, date, iso: fmtISO(date) };
          })
          .filter(Boolean)
          .sort((a, b) => a.date - b.date);

        dateDiag.points = datedRows.length;
        if (datedRows.length === 1) {
          dateDiag.dateRange = [datedRows[0].iso, datedRows[0].iso];
        } else if (datedRows.length >= 2) {
          dateDiag.dateRange = [datedRows[0].iso, datedRows[datedRows.length - 1].iso];
        }

        if (!datedRows.length) {
          return;
        }

        let cutoff = null;
        if (typeof group?.range === 'string' && group.range.startsWith('lastNDays:')) {
          const n = Number(group.range.split(':')[1] || '0');
          if (Number.isFinite(n) && n > 0) {
            const latest = datedRows[datedRows.length - 1].date;
            cutoff = new Date(latest.getTime());
            cutoff.setHours(0, 0, 0, 0);
            cutoff.setDate(cutoff.getDate() - (n - 1));
          }
        }

        itemDefs.forEach(({ item, colIdx, diag }) => {
          if (!item || colIdx < 0) {
            return;
          }

          const data = [];
          datedRows.forEach(({ row, iso, date }) => {
            if (cutoff && date < cutoff) {
              return;
            }
            const raw = row[colIdx];
            const value = normalizeRate(raw);
            if (value == null) {
              return;
            }
            data.push([iso, value]);
          });

          if (!data.length) {
            return;
          }

          diag.points = data.length;
          const range = deriveRange([{ data }]);
          if (Array.isArray(range) && range.length === 2) {
            diag.dateRange = range;
          }

          series.push({
            name: item.label || item.key || '',
            data,
            unit: '%',
          });
        });

      const meta = {

        unit: { rate: '%' },

      }

      const profile = PROFILES[sheetName];
      if (sheetName === '国能上市公司') {
        return convertGroupListed(rows, profile || {});
      }
      if (sheetName === '人民币汇率') {
        return convertCnyFx(rows, profile || {});
      }
      if (profile) {
        return buildByProfile(rows, profile, sheetName);
      }

      const headerIndex = rows.findIndex((row) => {
        if (!row) return false;
        const normalized = row.map((cell) => String(cell || '').trim().toLowerCase());
        const hasDate = KEYWORDS.date.some((key) => normalized.includes(key.toLowerCase()));
        const hasValue = KEYWORDS.value.some((key) => normalized.includes(key.toLowerCase()));
        return hasDate && hasValue;
      });

      let summaryRows = [];
      let dataRows = [];
      let headerRow = [];

      if (headerIndex >= 0) {
        summaryRows = rows.slice(0, headerIndex).filter((row) => row.length >= 2);
        headerRow = rows[headerIndex];
        dataRows = rows
          .slice(headerIndex + 1)
          .filter((row) => row && row.some((cell) => cell !== undefined && cell !== null && cell !== ''));
      } else {
        summaryRows = rows.filter((row) => row.length >= 2);
      }

      const summary = extractSummaryRows(summaryRows);
      const { series, note } = headerRow.length
        ? parseSeriesRows(dataRows, headerRow)
        : { series: [], note: '未找到包含日期/数值的表头，请确认格式。' };

      const unitEntry = Object.entries(summary).find(([key]) => /单位|unit/i.test(key));
      const meta = {
        ...baseMeta,
        unit: unitEntry ? String(unitEntry[1]) : '',
        sourceSheets: [sheetName],
      };

      const exportInfo = {
        rows: dataRows.length,
        last_updated: new Date().toISOString().slice(0, 19).replace('T', ' '),
      };
      const rangePair = deriveRange(series);
      if (rangePair) {
        exportInfo.range = rangePair;
      }

      return { summary, series, meta, note, export_info: exportInfo };
    };

    const createResultCard = ({ title, fileName, data }) => {
      const container = document.createElement('article');
      container.className = 'result-item';

      const header = document.createElement('div');
      header.className = 'result-item__header';
      const displayTitle = title || fileName;
      const seriesCount = Array.isArray(data?.series) ? data.series.length : 0;
      const summaryCount = data?.summary ? Object.keys(data.summary).length : 0;
      const sources = Array.isArray(data?.meta?.sourceSheets)
        ? data.meta.sourceSheets.join('、')
        : data?.meta?.sourceSheet || '';
      const metaItems = [
        `输出文件：<code>${fileName}</code>`,
        `系列数量：${seriesCount}`,
        `摘要指标：${summaryCount}`,
      ];
      if (sources) {
        metaItems.push(`来源表：${sources}`);
      }
      header.innerHTML = `
        <div>
          <h3 style="margin:0;">${displayTitle}</h3>
          <div class="result-item__meta">
            ${metaItems.map((item) => `<span>${item}</span>`).join('')}
          </div>
        </div>
      `;

      const actionGroup = document.createElement('div');
      const previewButton = document.createElement('button');
      previewButton.className = 'btn btn-secondary';
      previewButton.type = 'button';
      previewButton.innerHTML = '<i class="bi bi-eye"></i>预览 JSON';

      const downloadButton = document.createElement('button');
      downloadButton.className = 'btn';
      downloadButton.type = 'button';
      downloadButton.innerHTML = '<i class="bi bi-download"></i>下载 JSON';

      actionGroup.append(previewButton, downloadButton);
      header.append(actionGroup);
      container.append(header);

      if (data && data.note) {
        const note = document.createElement('div');
        note.className = 'alert';
        note.textContent = data.note;
        container.append(note);
      }

      const preview = document.createElement('textarea');
      preview.className = 'preview';
      preview.setAttribute('readonly', 'readonly');
      preview.style.display = 'none';
  preview.value = JSON.stringify(data ?? {}, null, 2);
      container.append(preview);

      previewButton.addEventListener('click', () => {
        const visible = preview.style.display === 'block';
        preview.style.display = visible ? 'none' : 'block';
        previewButton.innerHTML = visible
          ? '<i class="bi bi-eye"></i>预览 JSON'
          : '<i class="bi bi-eye-slash"></i>收起预览';
      });

      downloadButton.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(link.href);
      });

      return container;
    };

    const renderResults = (results) => {
      const resultArea = document.getElementById('result-area');
      resultArea.innerHTML = '';

      if (!results.length) {
        const empty = document.createElement('div');
        empty.className = 'alert';
        empty.textContent = '未找到可解析的工作表，请确认 Excel 文件的 Sheet 名称。';
        resultArea.append(empty);
        return;
      }

      results.forEach((item) => {
        const card = createResultCard(item);
        resultArea.append(card);
      });
    };

    const handleFile = async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const outputsByFile = new Map();
  const ctx = {};

      const mergeOutput = (fileName, partialJson, sheetName) => {
        if (!partialJson) return;
        const cloned = JSON.parse(JSON.stringify(partialJson));
        cloned.meta = cloned.meta || {};
        const sourceSet = new Set();
        if (Array.isArray(cloned.meta.sourceSheets)) {
          cloned.meta.sourceSheets.forEach((s) => s && sourceSet.add(s));
        }
        if (cloned.meta.sourceSheet) {
          sourceSet.add(cloned.meta.sourceSheet);
        }
        if (sheetName) {
          sourceSet.add(sheetName);
        }
        cloned.meta.sourceSheets = Array.from(sourceSet);
        if (!cloned.export_info) {
          cloned.export_info = {};
        }

        if (!outputsByFile.has(fileName)) {
          outputsByFile.set(fileName, cloned);
          return;
        }

        const prev = outputsByFile.get(fileName);
        prev.meta = prev.meta || {};
        const prevSources = new Set(Array.isArray(prev.meta.sourceSheets) ? prev.meta.sourceSheets : []);
        cloned.meta.sourceSheets.forEach((s) => s && prevSources.add(s));
        prev.meta.sourceSheets = Array.from(prevSources);
        prev.meta.unit = { ...(cloned.meta.unit || {}), ...(prev.meta.unit || {}) };

        prev.series = Array.isArray(prev.series) ? prev.series : [];
        const seriesMap = new Map(prev.series.map((serie) => [serie.name, serie]));
        (cloned.series || []).forEach((serie) => {
          if (!serie || !serie.name) return;
          const incoming = Array.isArray(serie.data) ? serie.data : [];
          if (seriesMap.has(serie.name)) {
            const target = seriesMap.get(serie.name);
            const merged = [
              ...((Array.isArray(target.data) ? target.data : [])),
              ...incoming,
            ].sort((a, b) => new Date(a[0]) - new Date(b[0]));
            const deduped = [];
            merged.forEach((point) => {
              if (!Array.isArray(point) || point.length < 2) return;
              const last = deduped[deduped.length - 1];
              if (last && last[0] === point[0]) {
                deduped[deduped.length - 1] = point;
              } else {
                deduped.push(point);
              }
            });
            target.data = deduped;
          } else {
            const cloneSerie = JSON.parse(JSON.stringify(serie));
            prev.series.push(cloneSerie);
            seriesMap.set(cloneSerie.name, cloneSerie);
          }
        });

        if (Array.isArray(cloned.changeSeries) && cloned.changeSeries.length) {
          prev.changeSeries = Array.isArray(prev.changeSeries) ? prev.changeSeries : [];
          const changeMap = new Map(prev.changeSeries.map((serie) => [serie.name, serie]));
          cloned.changeSeries.forEach((serie) => {
            if (!serie || !serie.name) return;
            const incoming = Array.isArray(serie.data) ? serie.data : [];
            if (changeMap.has(serie.name)) {
              const target = changeMap.get(serie.name);
              const merged = [
                ...((Array.isArray(target.data) ? target.data : [])),
                ...incoming,
              ].sort((a, b) => new Date(a[0]) - new Date(b[0]));
              const deduped = [];
              merged.forEach((point) => {
                if (!Array.isArray(point) || point.length < 2) return;
                const last = deduped[deduped.length - 1];
                if (last && last[0] === point[0]) {
                  deduped[deduped.length - 1] = point;
                } else {
                  deduped.push(point);
                }
              });
              target.data = deduped;
            } else {
              const cloneSerie = JSON.parse(JSON.stringify(serie));
              prev.changeSeries.push(cloneSerie);
              changeMap.set(cloneSerie.name, cloneSerie);
            }
          });
        }

        if (cloned.events) {
          prev.events = prev.events || {};
          Object.entries(cloned.events).forEach(([region, entries]) => {
            if (!Array.isArray(entries) || !entries.length) return;
            if (!Array.isArray(prev.events[region])) {
              prev.events[region] = [];
            }
            prev.events[region] = prev.events[region].concat(entries);
          });
        }

        prev.summary = Object.assign({}, prev.summary || {}, cloned.summary || {});

        prev.export_info = prev.export_info || {};
        if (cloned.export_info) {
          const r1 = prev.export_info.range;
          const r2 = cloned.export_info.range;
          if (r1 || r2) {
            const all = [];
            if (Array.isArray(r1)) {
              if (r1[0]) all.push(r1[0]);
              if (r1[1]) all.push(r1[1]);
            }
            if (Array.isArray(r2)) {
              if (r2[0]) all.push(r2[0]);
              if (r2[1]) all.push(r2[1]);
            }
            all.sort((a, b) => new Date(a) - new Date(b));
            if (all.length) {
              prev.export_info.range = [all[0], all[all.length - 1]];
            }
          }

          if (cloned.export_info.last_updated) {
            const normalizeTime = (value) => {
              if (!value) return null;
              const formatted = value.includes('T') ? value : value.replace(' ', 'T');
              const parsed = new Date(formatted);
              return Number.isNaN(parsed.getTime()) ? null : parsed;
            };
            const prevTime = normalizeTime(prev.export_info.last_updated);
            const nextTime = normalizeTime(cloned.export_info.last_updated);
            if (!prevTime || (nextTime && nextTime > prevTime)) {
              prev.export_info.last_updated = cloned.export_info.last_updated;
            }
          }

          if (typeof cloned.export_info.rows === 'number') {
            const prevRows = typeof prev.export_info.rows === 'number' ? prev.export_info.rows : 0;
            prev.export_info.rows = prevRows + cloned.export_info.rows;
          }
        }

        outputsByFile.set(fileName, prev);
      };

  for (const sheetName of workbook.SheetNames) {
        const sheet = workbook.Sheets[sheetName];
        if (!sheet) continue;

        if (sheetName === '公开市场货币') {
          const profile = PROFILES['公开市场货币'] || {};
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
          const headerRowIndex = Number.isInteger(profile.headerRow)
            ? Math.max(0, profile.headerRow)
            : 0;
          const header = rows[headerRowIndex] || [];
          const body = rows.slice(headerRowIndex + 1);
          const dateIdx = findColIndex(header, profile.dateCol);

          const summary = {
            r7d_amt_yi: null,
            r14d_amt_yi: null,
            mlf_amt_yi: null,
            tcd_amt_yi: null,
            slf_amt_yi: null,
            slo_amt_yi: null,
            repo_amt_yi: null,
          };
          const diagnostics = [];
          const rateSeries = [];
          let table = [];

          const summaryKeyMap = {
            rr7d: 'r7d_amt_yi',
            rr14d: 'r14d_amt_yi',
            mlf: 'mlf_amt_yi',
            tcd: 'tcd_amt_yi',
            slf: 'slf_amt_yi',
            slo: 'slo_amt_yi',
            repo: 'repo_amt_yi',
          };

          let rangeWindow = [];

          if (dateIdx < 0) {
            diagnostics.push({
              field: 'date',
              label: '日期',
              column: null,
              hit: false,
              note: '未找到日期列',
            });
          } else {
            const weekRows = computePrevWeekWorkdays(body, dateIdx, ANCHOR);
            const picked = pickLatestWeekRow(body, dateIdx);

            const { mon, fri } = prevCompletedWeekRange(ANCHOR);
            let windowStart = mon;
            let windowEnd = fri;

            if (!weekRows.length && picked && picked.date) {
              windowStart = mondayOf(picked.date);
              windowEnd = fridayOf(picked.date);
            }

            if (windowStart && windowEnd) {
              rangeWindow = [fmtISO(windowStart), fmtISO(windowEnd)];
            }

            if (picked && picked.row) {
              const latestRow = picked.row;
              const iso = picked.date instanceof Date ? fmtISO(picked.date) : '';

              table = [
                header.reduce((acc, cell, idx) => {
                  const key = cell != null && String(cell).trim()
                    ? String(cell).trim()
                    : `COL_${idx + 1}`;
                  acc[key] = latestRow[idx] ?? null;
                  return acc;
                }, {}),
              ];

              const items = Array.isArray(profile.items) ? profile.items : [];
              items.forEach((item) => {
                if (!item || !item.key) return;
                const summaryKey = summaryKeyMap[item.key];
                const baseLabel = item.label || item.key;

                if (summaryKey && item.cols?.inj) {
                  const amountIdx = findColIndex(header, item.cols.inj);
                  const amountVal = amountIdx >= 0 ? parseNumberLike(latestRow[amountIdx]) : null;
                  if (amountVal != null) {
                    summary[summaryKey] = amountVal;
                  }
                  diagnostics.push({
                    field: summaryKey,
                    label: `${baseLabel} 投放量(亿)`,
                    column: amountIdx >= 0 ? header[amountIdx] ?? null : null,
                    hit: amountIdx >= 0,
                    value: amountVal,
                  });
                }

                if (item.cols?.rate) {
                  const rateIdx = findColIndex(header, item.cols.rate);
                  const rawRate = rateIdx >= 0 ? toNumberOrNull(latestRow[rateIdx]) : null;
                  const rateVal = rawRate != null ? Number(rawRate.toFixed(4)) : null;
                  const seriesName = `${baseLabel}利率(%)`;
                  if (iso && rateVal != null) {
                    rateSeries.push({ name: seriesName, data: [[iso, rateVal]] });
                  }
                  diagnostics.push({
                    field: `rate:${seriesName}`,
                    label: seriesName,
                    column: rateIdx >= 0 ? header[rateIdx] ?? null : null,
                    hit: rateIdx >= 0,
                    value: rateVal,
                  });
                }
              });
            }
          }

          ctx.openMarketOm = {
            summary,
            diagnostics,
            rateSeries,
            table,
            rangeWindow,
          };
          continue;
        }

        if (sheetName === 'Shibor利率') {
          const profile = PROFILES['Shibor利率'] || {};
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
          const result = convertShibor(rows, profile);

          ctx.openMarketShibor = {
            series: Array.isArray(result?.series) ? result.series : [],
            diagnostics: result?.export_info?.diagnostics?.shibor || [],
            range: Array.isArray(result?.export_info?.range) ? result.export_info.range : undefined,
            rows: typeof result?.export_info?.rows === 'number' ? result.export_info.rows : undefined,
          };
          continue;
        }

        const fileName = SHEET_MAPPING[sheetName];
        if (!fileName) continue;
        const payload = convertWorksheet(sheetName, sheet);
        mergeOutput(fileName, payload, sheetName);
      }

      if (ctx.openMarketOm || ctx.openMarketShibor) {
        const payload = buildOpenMarketMinimal(ctx.openMarketOm, ctx.openMarketShibor);
        if (payload) {
          mergeOutput('open_market.json', payload, null);
        }
      }

      const aggregated = Array.from(outputsByFile.entries()).map(([fileName, data]) => {
        const sources = Array.isArray(data?.meta?.sourceSheets) ? data.meta.sourceSheets : [];
        const title = sources.length ? sources.join(' + ') : data?.meta?.sourceSheet || fileName;
        return { title, fileName, data };
      });

      renderResults(aggregated);
    };

    document.getElementById('xlsx-input').addEventListener('change', handleFile);
  </script>
</body>
