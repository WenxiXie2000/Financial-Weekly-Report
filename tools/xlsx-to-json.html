<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel 转 JSON 工具 · 金融市场周报</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        onerror="this.onerror=null;this.href='https://cdn.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css'" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    :root {
      color-scheme: light dark;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-elevated: rgba(255, 255, 255, 0.95);
      --border: rgba(82, 87, 100, 0.25);
      --border-strong: rgba(82, 87, 100, 0.45);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --accent-strong: rgba(37, 99, 235, 0.2);
      --attention: #c2410c;
      --attention-soft: rgba(194, 65, 12, 0.12);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.12);
    }

    body {
      margin: 0;
      padding: 32px 24px 64px;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
      color: var(--text-primary);
    }

    h1, h2, h3 {
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .tool-header {
      max-width: 960px;
      margin: 0 auto 32px;
      padding: 0 8px;
    }

    .tool-header__title {
      font-size: clamp(1.75rem, 2.3vw, 2.4rem);
      margin-bottom: 12px;
    }

    .tool-header__subtitle {
      font-size: 1rem;
      max-width: 640px;
    }

    .tool-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .tool-card {
      background: var(--surface);
      backdrop-filter: blur(22px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .upload-panel {
      display: grid;
      gap: 18px;
    }

    .upload-panel__action {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-secondary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .upload-panel__action:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      color: var(--accent);
    }

    .upload-panel__action input[type="file"] {
      display: none;
    }

    .upload-panel__hint {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .upload-panel__hint span {
      background: rgba(148, 163, 184, 0.16);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .result-area {
      min-height: 96px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 22px;
    }

    .result-item__header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .result-item__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .result-item__meta span {
      background: rgba(15, 23, 42, 0.04);
      border-radius: 999px;
      padding: 4px 10px;
    }

    .btn-group,
    .result-item__header > div:last-child {
      display: inline-flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      color: white;
      background: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.2);
    }

    .btn-secondary {
      background: rgba(37, 99, 235, 0.08);
      color: var(--accent);
    }

    .btn-secondary:hover {
      background: rgba(37, 99, 235, 0.15);
    }

    .alert {
      border-radius: var(--radius-md);
      border: 1px solid rgba(148, 163, 184, 0.45);
      padding: 14px 18px;
      background: rgba(148, 163, 184, 0.12);
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .preview {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 14px;
      min-height: 200px;
      background: rgba(15, 23, 42, 0.96);
      color: #e2e8f0;
      overflow-x: auto;
    }

    .diagnostics-panel {
      border-radius: var(--radius-md);
      border: 1px solid rgba(37, 99, 235, 0.2);
      background: var(--accent-soft);
      padding: 16px 18px;
      font-size: 0.95rem;
    }

    .diagnostics-panel[open] {
      background: rgba(37, 99, 235, 0.06);
    }

    .diagnostics-panel summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
      list-style: none;
    }

    .diagnostics-panel summary::-webkit-details-marker {
      display: none;
    }

    .diagnostics-list {
      display: grid;
      gap: 14px;
    }

    .diagnostics-sheet {
      border-radius: var(--radius-md);
      border: 1px solid rgba(37, 99, 235, 0.18);
      background: rgba(255, 255, 255, 0.82);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
    }

    .diagnostics-entry {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .diagnostics-more {
      color: var(--accent);
    }

    .diagnostics-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #15803d;
      font-weight: 600;
    }

    .diagnostics-chip.warn {
      background: var(--attention-soft);
      color: var(--attention);
    }

    footer {
      max-width: 960px;
      margin: 40px auto 0;
      padding: 0 8px;
      font-size: 0.85rem;
      color: rgba(71, 85, 105, 0.75);
    }

    code {
      font-family: "JetBrains Mono", "SFMono-Regular", monospace;
      background: rgba(15, 23, 42, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 16px 48px;
      }

      .tool-card {
        padding: 22px;
      }

      .result-item {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <header class="tool-header">
    <h1 class="tool-header__title">Excel 转 JSON 转换助手</h1>
    <p class="tool-header__subtitle">
      将周报 Excel 中的多个工作表一键转换为 JSON 文件，自动匹配输出路径并生成诊断提示，帮助你快速检查数据格式与缺失项。
    </p>
  </header>

  <main class="tool-container">
    <section class="tool-card">
      <div class="upload-panel">
        <div>
          <h2 style="margin-bottom: 8px;">选择待转换的 Excel 文件</h2>
          <p>支持 <code>.xlsx</code> / <code>.xlsm</code> / <code>.xlsb</code>，我们会自动识别支持的工作表。</p>
        </div>
        <label class="upload-panel__action">
          <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
          <span>点击选择或拖拽 Excel 文件到此处</span>
          <input id="xlsx-input" type="file" accept=".xlsx,.xlsm,.xlsb" />
        </label>
        <div class="upload-panel__hint">
          <span><i class="bi bi-lightning-charge" aria-hidden="true"></i> 自动生成诊断记录</span>
          <span><i class="bi bi-database" aria-hidden="true"></i> 匹配输出 JSON 文件名</span>
          <span><i class="bi bi-shield-check" aria-hidden="true"></i> 支持逐个预览与下载</span>
        </div>
      </div>
    </section>

    <section class="tool-card">
      <div>
        <h2 style="margin-bottom: 8px;">转换结果</h2>
        <p>上传后将在此呈现生成的 JSON 文件、诊断提醒及快速预览。</p>
      </div>
      <div id="result-area" class="result-area" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>提示：若遇到未知工作表，可在 <code>js/x2j/core.js</code> 和 <code>js/sheet-profiles.js</code> 中补充映射配置，再次上传即可。</p>
  </footer>

  <script type="module" src="./xlsx-to-json-main.js"></script>
</body>
</html>
