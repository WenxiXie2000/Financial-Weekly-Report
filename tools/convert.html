<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel 转换工具 · 金融市场周报</title>
  <meta name="description" content="上传 Excel 周报并导出结构化 JSON 的辅助工具。" />
  <link
    rel="stylesheet"
    href="https://cdn.staticfile.org/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    onerror="this.onerror=null;this.href='https://cdn.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css';"
  />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body.tool-body {
      padding: 32px 16px 64px;
      background: var(--page-bg, var(--background));
    }
    .tool-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .tool-header h1 {
      margin: 0 0 8px;
    }
    .tool-header p {
      margin: 0;
    }
    .step-list {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
  <!-- 第三方库（必须先于模块） -->
  <script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.staticfile.org/jszip/3.10.1/jszip.min.js"></script>
  <script type="module">
  // profiles：默认导出就是整张映射，同时也有命名导出 SHEET_PROFILES（两者等价）
  import SHEET_PROFILES from '../js/x2j/profiles.js';

  // 解析器（缺哪个文件就先注释，避免 404）
  import '../js/x2j/parsers/cny-fx.js';
  import '../js/x2j/parsers/open-market.js';
  import '../js/x2j/parsers/shibor.js';
  import '../js/x2j/parsers/bond-yield.js';
  import '../js/x2j/parsers/mid-paper.js';
  import '../js/x2j/parsers/equity-cn.js';
  import '../js/x2j/parsers/equity-global.js';
  import '../js/x2j/parsers/group-listed.js';
  // import '../js/x2j/parsers/news.js'; // 目前不存在，会 404，先别引

  // 使用 runArrayBuffer 统一解析流程
  import { runArrayBuffer } from '../js/x2j/core.js';

  const $ = (s) => document.querySelector(s);
  const fileInput = $('#xlsxFile');
  const logBox = $('#convertLog');

  const log = (lv, msg, extra) => {
    (console[lv] || console.log)('[convert]', msg, extra || '');
    if (!logBox) return;
    const row = document.createElement('div');
    row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(row);
    logBox.scrollTop = logBox.scrollHeight;
  };

  async function runConvert() {
    const file = fileInput?.files?.[0];
    if (!file) return alert('请选择 Excel 文件');

    try {
      if (typeof XLSX === 'undefined') throw new Error('XLSX 未加载');
      if (typeof JSZip === 'undefined') throw new Error('JSZip 未加载');

      log('info', `读取 ${file.name}`);
      const buf = await file.arrayBuffer();

      log('info', '解析工作表并构建数据集中…');

      const result = await runArrayBuffer(buf, {
        profiles: SHEET_PROFILES,
        anchor: new Date(), // “上一周”计算锚点
        XLSX
      });
      console.log('[convert] result=', result);
      const files = result?.files instanceof Map ? result.files : new Map();
      console.log('[convert] files.size=', files.size, 'names=', [...files.keys()]);
      if (Array.isArray(result?.diagnostics)) {
        console.table(
          result.diagnostics.map((d) => ({
            sheet: d?.sheet || d?.name,
            status: d?.status || d?.error || d?.note || 'ok',
            dateColMatcher: String(d?.profileDateCol || d?.dateCol || ''),
            matchedHeader: d?.dateHeader || d?.column || '',
            headerRow: typeof d?.headerRow === 'number' ? d.headerRow : '',
            sampleHeaders: (d?.headers || d?.closest || []).slice(0, 6).join(' | '),
          }))
        );
      }

      const zip = new JSZip();
      const folder = zip.folder('values-only');
      const outNames = [];

      files.forEach((json, filename) => {
        folder.file(filename, JSON.stringify(json, null, 2));
        outNames.push(filename);
      });

      console.log('[convert] 输出文件：', outNames);
      if (Array.isArray(result?.diagnostics) && result.diagnostics.length) {
        console.log('[convert] 诊断信息 diagnostics：', result.diagnostics);
        log('info', `捕获 ${result.diagnostics.length} 条诊断信息，可在控制台查看`);
      }
      if (!outNames.length) {
        log('warn', '未生成任何输出文件，请检查 profiles 与解析器是否正确注册');
      }

      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'values-only.zip';
      a.click();
      URL.revokeObjectURL(a.href);

      log('info', `已导出 values-only.zip，包含文件：${outNames.join(', ') || '(空)'}`);
    } catch (e) {
      console.error('[convert] 处理失败', e);
      alert('转换失败：' + e.message);
    }
  }

  document.querySelector('#btn-convert')?.addEventListener('click', runConvert);
  // 备用：window.runConvert = runConvert;
</script>
</head>
<body class="tool-body">
  <noscript class="noscript">
    您的浏览器未启用 JavaScript，本工具无法运行。请开启 JavaScript 后刷新页面。
  </noscript>

  <main class="tool-container">
    <header class="tool-header">
      <h1>Excel 转换工具</h1>
      <p class="muted">
        上传周报 Excel 并快速导出 JSON。建议先在文件副本上验证输出，再覆盖线上数据。
      </p>
      <p class="muted">
        业务视图入口已移动到 <a href="../index.html">首页</a>，此页面专注于转换操作。
      </p>
    </header>

    <section class="card conversion-panel" aria-labelledby="conversion-title">
      <div class="card-header" id="conversion-title">Excel 转换</div>
      <div class="card-content">
        <div class="conversion-actions">
          <label class="btn" for="xlsxFile">
            <i class="bi bi-upload"></i>
            选择 Excel 文件
          </label>
          <input id="xlsxFile" type="file" accept=".xlsx,.xls" hidden />
          <div class="action-buttons">
            <button type="button" id="btn-convert" class="btn btn-primary">
              批量导出 JSON
            </button>
          </div>
        </div>
        <div id="convertLog" class="conversion-log" role="log" aria-live="polite"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="guide-title">
      <div class="card-header" id="guide-title">使用说明</div>
      <div class="card-content">
        <ol class="step-list">
          <li>下载最新的 Excel 周报文件。</li>
          <li>点击“选择 Excel 文件”上传。</li>
          <li>点击“批量导出 JSON”生成压缩包。</li>
          <li>检查输出 JSON 内容，确认无误后替换线上数据源。</li>
        </ol>
      </div>
    </section>
  </main>

</body>
</html>
