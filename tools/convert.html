<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel 转换工具 · 金融市场周报</title>
  <meta name="description" content="上传 Excel 周报并导出结构化 JSON 的辅助工具。" />
  <link
    rel="stylesheet"
    href="https://cdn.staticfile.org/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    onerror="this.onerror=null;this.href='https://cdn.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css';"
  />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body.tool-body {
      padding: 32px 16px 64px;
      background: var(--page-bg, var(--background));
    }
    .tool-container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .tool-header h1 {
      margin: 0 0 8px;
    }
    .tool-header p {
      margin: 0;
    }
    .step-list {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
  <script
    src="https://cdn.staticfile.org/jszip/3.10.1/jszip.min.js"
    defer
    onerror="this.onerror=null;this.src='https://cdn.baomitu.com/jszip/3.10.1/jszip.min.js';"
  ></script>
  <script
    src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"
    defer
    onerror="this.onerror=null;this.src='https://cdn.baomitu.com/xlsx/0.18.5/xlsx.full.min.js';"
  ></script>
  <script type="module">
    import '../js/x2j/utils.js';
    import {
      registerGlobalCore,
      createMinimalParsers,
    } from '../js/x2j/core.js';

    function getAnchorFromUrl() {
      try {
        const url = new URL(window.location.href);
        const raw = url.searchParams.get('anchor');
        if (!raw) return null;
        const candidate = new Date(`${raw}T00:00:00`);
        return Number.isNaN(candidate.getTime()) ? null : candidate;
      } catch (err) {
        console.warn('[convert] URL 解析失败', err);
        return null;
      }
    }

    const anchor = (() => {
      const picked = getAnchorFromUrl() || new Date();
      picked.setHours(0, 0, 0, 0);
      return picked;
    })();

    window.__conversionAnchor = anchor;

    registerGlobalCore(window);
    createMinimalParsers(window);
  </script>
</head>
<body class="tool-body">
  <noscript class="noscript">
    您的浏览器未启用 JavaScript，本工具无法运行。请开启 JavaScript 后刷新页面。
  </noscript>

  <main class="tool-container">
    <header class="tool-header">
      <h1>Excel 转换工具</h1>
      <p class="muted">
        上传周报 Excel 并快速导出 JSON。建议先在文件副本上验证输出，再覆盖线上数据。
      </p>
      <p class="muted">
        业务视图入口已移动到 <a href="../index.html">首页</a>，此页面专注于转换操作。
      </p>
    </header>

    <section class="card conversion-panel" aria-labelledby="conversion-title">
      <div class="card-header" id="conversion-title">Excel 转换</div>
      <div class="card-content">
        <div class="conversion-actions">
          <label class="btn" for="xlsxFile">
            <i class="bi bi-upload"></i>
            选择 Excel 文件
          </label>
          <input id="xlsxFile" type="file" accept=".xlsx,.xls" hidden />
          <div class="action-buttons">
            <button type="button" id="btn-convert" class="btn btn-primary">
              批量导出 JSON
            </button>
            <button type="button" id="btn-open-market-test" class="btn btn-secondary">
              测试公开市场
            </button>
          </div>
        </div>
        <div id="convertLog" class="conversion-log" role="log" aria-live="polite"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="guide-title">
      <div class="card-header" id="guide-title">使用说明</div>
      <div class="card-content">
        <ol class="step-list">
          <li>下载最新的 Excel 周报文件。</li>
          <li>点击“选择 Excel 文件”上传。</li>
          <li>点击“批量导出 JSON”生成压缩包；如仅需检查公开市场数据，可用“测试公开市场”。</li>
          <li>检查输出 JSON 内容，确认无误后替换线上数据源。</li>
        </ol>
      </div>
    </section>
  </main>

  <script src="./conversion-patch.js"></script>
  <script type="module">
    const ensureLibraries = () => {
      if (!window.XLSX) {
        throw new Error('XLSX 未加载');
      }
      if (!window.JSZip) {
        throw new Error('JSZip 未加载');
      }
    };

    async function runOpenMarketOnce(file) {
      ensureLibraries();
      const buf = await file.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array' });
      const toRows = (sheet) =>
        XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });

      const omSheet = workbook.Sheets['公开市场货币'];
      const shiborSheet = workbook.Sheets['Shibor利率'];
      if (!omSheet || !shiborSheet) {
        alert('未找到公开市场货币或 Shibor利率工作表');
        return;
      }

      const omRows = toRows(omSheet);
      const shiborRows = toRows(shiborSheet);
      const pack = window.__parseOpenMarketShiborMinimal?.(
        omRows,
        shiborRows,
        window.__conversionAnchor
      );
      if (!pack || !pack.json) {
        alert('公开市场解析失败');
        return;
      }

      const blob = new Blob([JSON.stringify(pack.json, null, 2)], {
        type: 'application/json',
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = pack.filename;
      link.click();
      URL.revokeObjectURL(link.href);
      alert(`已下载 ${pack.filename}`);
    }

    const openMarketButton = document.getElementById('btn-open-market-test');
    const openMarketInput = document.querySelector('#xlsxFile');

    openMarketButton?.addEventListener('click', async () => {
      const file = openMarketInput?.files?.[0];
      if (!file) {
        alert('请先选择 Excel 文件');
        return;
      }
      try {
        await runOpenMarketOnce(file);
      } catch (err) {
        console.error('[open-market-test] 失败', err);
        alert('转换失败，请查看控制台日志');
      }
    });
  </script>
</body>
</html>
