<!-- components/card-demo.html -->
<div class="container mx-auto px-4 py-5">
  <!-- 股票指数卡片 -->
  <div class="card">
    <h2 class="primary-color">股票指数行情</h2>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <div>
        <h3>上证指数</h3>
        <p class="fs-5 mt-1">3,120.58</p>
      </div>
      <p class="success-color fs-5">+1.23%</p>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-4">
      <div>
        <h3>深证成指</h3>
        <p class="fs-5 mt-1">10,256.34</p>
      </div>
      <p class="danger-color fs-5">-0.87%</p>
    </div>
  </div>

  <!-- 债券卡片 -->
  <div class="card">
    <h2 class="primary-color">国债收益率</h2>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <div>
        <h3>10年期国债</h3>
        <p class="fs-5 mt-1">2.65%</p>
      </div>
      <p class="text-muted">持平</p>
    </div>
  </div>
</div>
